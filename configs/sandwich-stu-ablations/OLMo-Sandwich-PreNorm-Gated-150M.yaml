run_name: OLMo-Sandwich-PreNorm-Gated-150M
seed: 6198
dry_run: false

wandb:
  name: ${run_name}
  project: olmo-sandwich-stu-ablations
  entity: kg4280-princeton-university
  group: sandwich-ablations

model:
  d_model: 768
  n_heads: 12
  n_layers: 5
  mlp_ratio: 8
  weight_tying: false
  alibi: false
  rope: true
  flash_attention: false
  attention_dropout: 0.0
  attention_layer_norm: false
  clip_qkv: null
  include_bias: false
  block_type: stu_sandwich
  layer_norm_type: rms
  layer_norm_with_affine: true
  layer_norm_eps: 1e-6
  bias_for_layer_norm: false
  attention_layer_norm_with_affine: false
  activation_type: swiglu
  residual_dropout: 0.0
  embedding_dropout: 0.0
  max_sequence_length: 2048
  vocab_size: 50280
  embedding_size: 50304
  eos_token_id: 0
  pad_token_id: 1
  init_device: cuda
  init_fn: normal
  init_std: 0.02
  init_cutoff_factor: 3
  
  # STU-specific configuration
  stu_num_eigh: 16
  stu_use_hankel_L: false
  stu_use_approx: true
  
  # MLP Sandwich configuration
  stu_enable_mlp_sandwich: true  # Enable MLP sandwich around STU
  stu_mlp_hidden_size: null      # null = use mlp_ratio * d_model (6144 for 150M)
  
  # Sandwich-specific ablation settings
  stu_sandwich_norm_type: rms
  stu_sandwich_prenorm: true
  stu_sandwich_residual_mode: gated_outer  # Gated outer residual (CHANGED)
  stu_sandwich_dropout: 0.0

softmax_auxiliary_loss: true
auxiliary_loss_multiplier: 1e-5
fused_loss: false

ddp:
  grad_sync_mode: batch
  find_unused_params: false

compile: null

optimizer:
  name: adamw
  learning_rate: 6.0e-4
  weight_decay: 0.1
  eps: 1e-8
  decay_norm_and_bias: true
  decay_embeddings: true
  betas:
  - 0.9
  - 0.95
  metrics_log_interval: 1

scheduler:
  name: cosine_with_warmup
  units: steps
  t_warmup: 5000
  t_max: 50000
  alpha_f: 0.1
  warmup_min_lr: 0.0

tokenizer:
  identifier: tokenizers/allenai_gpt-neox-olmo-dolma-v1_5.json
  truncate_direction: right

save_folder: /scratch/gpfs/EHAZAN/kg4280/OLMo-data/checkpoints/OLMo-Sandwich/${run_name}
save_overwrite: false
save_interval: 5000
save_num_checkpoints_to_keep: -1

load_path: null

max_duration: 50000
global_train_batch_size: 1024
device_train_microbatch_size: 4

precision: amp_bf16
distributed_strategy: ddp

gen1_gc_interval: 1

max_grad_norm: 1.0
max_grad_norm_ratio: null

speed_monitor:
  window_size: 20

eval_interval: 5000
eval_subset_num_batches: -1
device_eval_batch_size: ${device_train_microbatch_size}

evaluators:
  - label: all-small-ppl-validation
    data:
      num_workers: 0
      drop_last: true
      datasets:
        dolma_wiki-validation:
          - /scratch/gpfs/EHAZAN/tharuntk/OLMo-data/eval-data/perplexity/v3_small_gptneox20b/dolma_wiki/val/part-0-00000.npy
        wikitext_103-validation:
          - /scratch/gpfs/EHAZAN/tharuntk/OLMo-data/eval-data/perplexity/v3_small_gptneox20b/wikitext_103/val/part-0-00000.npy

  - label: piqa
    type: downstream
  - label: hellaswag
    type: downstream
  - label: winogrande
    type: downstream
  - label: openbook_qa
    type: downstream
  - label: sciq
    type: downstream
  - label: arc_easy
    type: downstream
  - label: commonsense_qa
    type: downstream
  - label: social_iqa
    type: downstream
  - label: mmlu_stem_var
    type: downstream
  - label: mmlu_humanities_var
    type: downstream
  - label: mmlu_social_sciences_var
    type: downstream
  - label: mmlu_other_var
    type: downstream

data:
  pad_direction: right
  num_workers: 32
  drop_last: true
  pin_memory: true
  prefetch_factor: 8
  persistent_workers: true
  timeout: 0
  instance_filter:
    repetition_max_period: 13
    repetition_min_period: 1
    repetition_max_count: 32
  paths:
    - /scratch/gpfs/EHAZAN/tharuntk/OLMo-data/preprocessed/olmo-mix/v1_6-decontaminated/wiki/gpt-neox-olmo-dolma-v1_5/part-0-00000.npy
    - /scratch/gpfs/EHAZAN/tharuntk/OLMo-data/preprocessed/olmo-mix/v1_6-decontaminated/wiki/gpt-neox-olmo-dolma-v1_5/part-1-00000.npy

